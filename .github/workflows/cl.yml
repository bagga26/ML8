name: ML CI/CD Pipeline
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  train-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Download code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11    
      - name: Install libraries
        run: pip install -r requirements.txt
      - name: Train model
        run: python train.py
      - name: Test model
        run: python test.py    
      - name: Deployment
        if: success() && github.ref == 'refs/heads/main'
        env:
          DEPLOY_HOOK_URL: ${{secrets.RENDER_DEPLOY_HOOK_URL }}  
        run: curl --fail --silent --show-error "$DEPLOY_HOOK_URL" 